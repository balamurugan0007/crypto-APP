name: cryto_app
description: "A mini CoinGecko-style crypto research app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # BLoC state management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # API calls
  http: ^1.2.2

  # For chart
  fl_chart: ^0.69.0

  # Caching images
  cached_network_image: ^3.4.1

  # Shared preferences for saving watchlist
  shared_preferences: ^2.3.2

  # Equatable for easy equality in models
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
